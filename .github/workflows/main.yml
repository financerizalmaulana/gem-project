name: GEM Daily Pipeline

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC daily = 08:00 WIB
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-gem-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_pipeline.py

      - name: Commit updated dataset and report back to the repo
        run: |
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git add data/processed/master_dataset.parquet reports/latest_report.md data/processed/_last_known_regime.json
          git diff --staged --quiet || git commit -m "Automated GEM data refresh $(date -u +%Y-%m-%d)"
          git push
